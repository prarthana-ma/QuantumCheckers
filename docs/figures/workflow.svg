<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">QCheckers game execution and collapse workflow</title>
  <desc id="desc">Browser actions are sent to the server, validated against the engine's legal actions, applied as complex-state transitions, and the updated state is broadcast back. A collapse is resolved once, by the seeded local sampler or a single IBM Quantum measurement shot, and the state is projected onto the sampled square.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a78bfa"/></marker>
    <style>.bg{fill:#09090b}.box{fill:#17171c;stroke:#8b5cf6;stroke-width:2;rx:14}.title{fill:#f4f4f5;font:600 18px 'Segoe UI',sans-serif}.body{fill:#c4c4ce;font:15px 'Segoe UI',sans-serif}.tag{fill:#a78bfa;font:600 13px 'Segoe UI',sans-serif;letter-spacing:1.2px}.line{fill:none;stroke:#a78bfa;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1200" height="580"/>
  <text x="48" y="48" class="tag">GAME WORKFLOW</text>
  <rect class="box" x="55" y="95" width="190" height="115"/>
  <text x="78" y="137" class="title">1 · Send action</text><text x="78" y="170" class="body">Client move request</text>
  <rect class="box" x="285" y="95" width="190" height="115"/>
  <text x="308" y="137" class="title">2 · Validate</text><text x="308" y="170" class="body">Protocol + legality</text>
  <rect class="box" x="515" y="95" width="190" height="115"/>
  <text x="538" y="137" class="title">3 · Apply</text><text x="538" y="170" class="body">Complex-state step</text>
  <rect class="box" x="745" y="95" width="190" height="115"/>
  <text x="768" y="137" class="title">4 · Broadcast</text><text x="768" y="170" class="body">Updated room view</text>
  <rect class="box" x="975" y="95" width="180" height="115"/>
  <text x="998" y="137" class="title">5 · Render</text><text x="998" y="170" class="body">Occupancy marginals</text>
  <path class="line" d="M245 152 H275"/><path class="line" d="M475 152 H505"/><path class="line" d="M705 152 H735"/><path class="line" d="M935 152 H965"/>
  <text x="48" y="290" class="tag">COLLAPSE WORKFLOW · CAPTURE, OBSERVE, DECOHERENCE</text>
  <rect class="box" x="55" y="340" width="190" height="125"/>
  <text x="78" y="385" class="title">1 · Collapse</text><text x="78" y="420" class="body">Capture/Observe/timer</text>
  <rect class="box" x="285" y="340" width="190" height="125"/>
  <text x="308" y="385" class="title">2 · Circuit</text><text x="308" y="420" class="body">One shot, √p amplitudes</text>
  <rect class="box" x="515" y="340" width="190" height="125"/>
  <text x="538" y="385" class="title">3 · Sample</text><text x="538" y="420" class="body">Seeded RNG or IBM shot</text>
  <rect class="box" x="745" y="340" width="190" height="125"/>
  <text x="768" y="385" class="title">4 · Project</text><text x="768" y="420" class="body">Bitstring → square</text>
  <rect class="box" x="975" y="340" width="180" height="125"/>
  <text x="998" y="385" class="title">5 · Report</text><text x="998" y="420" class="body">Provenance or refusal</text>
  <path class="line" d="M245 402 H275"/><path class="line" d="M475 402 H505"/><path class="line" d="M705 402 H735"/><path class="line" d="M935 402 H965"/>
  <text x="48" y="545" class="body">No simulator or RNG substitution on the configured hardware path.</text>
</svg>
